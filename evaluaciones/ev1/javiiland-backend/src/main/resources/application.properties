spring.application.name=javiiland

# ---- Perfil local: evita conexión a un Identity Provider durante el desarrollo ----
spring.profiles.active=local

# ---- Base de datos MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/reservas_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=tia
spring.datasource.password=Latiahoerest
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Servidor ----
server.port=8080
# API Gateway actúa como proxy inverso y puede enviar X-Forwarded-*.
# Esta opción permite que Spring use el esquema, host y puerto originales.
server.forward-headers-strategy=framework

# ---- OAuth2 Resource Server ----
# LOCAL: estas propiedades permanecen comentadas para evitar conexión a internet o a un IdP real.
# El JwtDecoder HMAC de SecurityConfig se utiliza únicamente con el perfil local.
# PRODUCCIÓN: descomentar ambas líneas y reemplazar las variables por los valores de Azure AD o Cognito.

# spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}
# spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AUDIENCE}
# issuer-uri: URL del emisor real, por ejemplo https://login.microsoftonline.com/<tenant-id>/v2.0

# audiences: identificador de audiencia de la API registrada en Azure AD o Cognito

# Si el balanceador/proxy del entorno expone X-Forwarded-* mediante el contenedor
# Servlet en vez de Spring, puede utilizarse native como alternativa:
# server.forward-headers-strategy=native